<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetWatch - Network Security Monitoring System</title>
    <style>
        :root {
            color-scheme: dark;
            --page: #10151d;
            --panel: #192232;
            --line: #303b4d;
            --text: #f2f5fb;
            --muted: #aebbd0;
            --blue: #2f7df4;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-width: 320px;
            min-height: 100vh;
            padding: 10px 12px;
            background: var(--page);
            color: var(--text);
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .topbar {
            min-height: 92px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            padding: 0 20px 8px 0;
        }

        .brand h1 { margin: 0; font-size: 22px; line-height: 1.25; }
        .brand p { margin: 2px 0 0; font-size: 16px; font-style: italic; }

        .service-control { display: flex; align-items: center; gap: 24px; }
        .status { display: inline-flex; align-items: center; gap: 7px; font-weight: 700; }
        .status-dot { color: #e8edf5; font-size: 18px; line-height: 1; }
        .start-button {
            min-width: 160px;
            padding: 10px 18px;
            border: 0;
            border-radius: 0;
            background: var(--blue);
            color: white;
            font: inherit;
            cursor: pointer;
        }
        .start-button:hover, .filter-button.active:hover { background: #438af8; }

        .metrics {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 32px;
            margin-bottom: 6px;
        }

        .metric, .panel { background: var(--panel); }
        .metric { min-height: 124px; text-align: center; }
        .metric h2 {
            min-height: 36px;
            margin: 0;
            padding: 9px 8px 8px;
            border-bottom: 1px solid var(--line);
            font-size: 14px;
        }
        .metric p { margin: 12px 0; font-size: 26px; font-weight: 700; }
        .metric.alert-count p { color: #ff1717; }

        .dashboard-grid {
            display: grid;
            grid-template-columns: minmax(0, 3fr) minmax(300px, 2.06fr);
            gap: 14px;
            min-height: calc(100vh - 238px);
        }
        .left-column { display: grid; grid-template-rows: 164px minmax(260px, 1fr); gap: 7px; min-height: 0; }
        .panel { min-width: 0; }
        .panel-heading {
            min-height: 36px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 0 16px;
            border-bottom: 1px solid var(--line);
        }
        .panel-heading h2 { margin: 0; font-size: 14px; }
        .panel-meta { color: var(--muted); font-size: 12px; }
        .chart-space { height: calc(100% - 36px); }
        .connections { display: flex; flex-direction: column; min-height: 0; }
        .filters { display: flex; gap: 8px; }
        .filter-button {
            padding: 5px 13px;
            border: 0;
            border-radius: 7px;
            background: #202b3e;
            color: #dce5f3;
            font: inherit;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .filter-button.active { background: var(--blue); color: white; }
        .table-space { flex: 1; }
        .alerts { min-height: 0; }
        .alerts .chart-space { min-height: 200px; }

        @media (max-width: 850px) {
            .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
            .dashboard-grid { grid-template-columns: 1fr; min-height: 0; }
            .left-column { grid-template-rows: 180px 320px; }
            .alerts { min-height: 280px; }
        }
        @media (max-width: 520px) {
            body { padding: 10px; }
            .topbar { align-items: flex-start; flex-direction: column; gap: 14px; padding: 8px 0 16px; }
            .service-control { width: 100%; justify-content: space-between; gap: 10px; }
            .start-button { min-width: 130px; }
            .metrics { gap: 9px; }
            .metric { min-height: 108px; }
            .metric h2 { font-size: 12px; }
            .panel-heading { padding: 0 10px; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <h1>NetWatch</h1>
            <p>Network Security Monitoring System</p>
        </div>
        <div class="service-control">
            <span class="status"><span class="status-dot" aria-hidden="true">●</span>Not Running</span>
            <button class="start-button" type="button">Start Service</button>
        </div>
    </header>

    <main>
        <section class="metrics" aria-label="Network summary">
            <article class="metric">
                <h2>Packets per second</h2>
                <p>0</p>
            </article>
            <article class="metric">
                <h2>Active connections</h2>
                <p>0</p>
            </article>
            <article class="metric alert-count">
                <h2>Open alerts</h2>
                <p>0</p>
            </article>
            <article class="metric">
                <h2>Blocked IPs</h2>
                <p>0</p>
            </article>
        </section>

        <section class="dashboard-grid" aria-label="Network activity">
            <div class="left-column">
                <section class="panel traffic">
                    <div class="panel-heading">
                        <h2>Traffic</h2>
                        <span class="panel-meta">last 60 seconds</span>
                    </div>
                    <div class="chart-space" aria-label="Traffic chart"></div>
                </section>

                <section class="panel connections">
                    <div class="panel-heading">
                        <h2>Connections</h2>
                        <div class="filters" aria-label="Connection filters">
                            <button class="filter-button" type="button">All</button>
                            <button class="filter-button active" type="button">Suspicious</button>
                        </div>
                    </div>
                    <div class="table-space"></div>
                </section>
            </div>

            <section class="panel alerts">
                <div class="panel-heading">
                    <h2>Alerts</h2>
                    <span class="panel-meta">58 total</span>
                </div>
                <div class="chart-space" aria-label="Alerts list"></div>
            </section>
        </section>
    </main>
</body>
</html>
